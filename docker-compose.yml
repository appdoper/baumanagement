services:
  db:
    image: postgres:16-alpine
    container_name: hausmanagement-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-haus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haus_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-hausmanagement}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-haus} -d ${POSTGRES_DB:-hausmanagement}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
